name: workstation-lab

services:
  workstation:
    build:
      context: .
      dockerfile_inline: |
        FROM docker:28-dind
        RUN apk add --no-cache bash coreutils curl file git jq shadow
        WORKDIR /workspace
    privileged: true
    working_dir: /workspace
    environment:
      DOCKER_TLS_CERTDIR: ""
      LAB_GIT_NAME: "${LAB_GIT_NAME:-workstation-student}"
      LAB_GIT_EMAIL: "${LAB_GIT_EMAIL:-student@example.invalid}"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - .:/workspace
      # 실제 호스트에서 시작해 nested container까지 이어지는 bind source.
      - ./volumes/bind-mount:/mnt/host-bind-mount-volume
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  dind-data:
